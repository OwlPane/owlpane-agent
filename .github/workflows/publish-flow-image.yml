name: Publish ndm flow image
on:
  push:
    tags: ["ndm-flow-v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test ./...
        working-directory: docker/flow
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Extract version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#ndm-flow-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "ghcr.io/${{ github.repository_owner }}/owlpane-ndm-flow:${{ steps.v.outputs.version }}" \
            -t "ghcr.io/${{ github.repository_owner }}/owlpane-ndm-flow:latest" \
            --push docker/flow
      - name: Sign image (keyless, non-blocking)
        continue-on-error: true
        uses: sigstore/cosign-installer@v3
      - name: Cosign sign image
        continue-on-error: true
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/owlpane-ndm-flow:${{ steps.v.outputs.version }}"
