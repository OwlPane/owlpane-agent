{{- $na := include "owlpane.nodeAgentMerged" . | fromYaml -}}
{{- $carbon := include "owlpane.carbonMerged" . | fromYaml -}}
{{- $kepler := index $carbon "kepler" | default dict -}}
{{- if and $na.enabled (index $kepler "enabled" | default false) }}
# Kepler: measured node energy (RAPL/HWMON/ACPI counters) for Owlpane Carbon's "measured" mode.
# Runs privileged with read-only host /proc and /sys — that is what the energy counters require
# (https://sustainable-computing.io/docs/user/installation/). hostNetwork so the node agent on the
# same node scrapes it over the node IP; the scrape config is in node-config.yaml (prometheus/kepler).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: owlpane-kepler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "owlpane.labels" . | nindent 4 }}
    app.kubernetes.io/component: kepler
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: owlpane-kepler
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: owlpane-kepler
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: kepler
    spec:
      hostNetwork: true
      containers:
        - name: kepler
          image: "{{ (index $kepler "image" | default dict).repository | default "quay.io/sustainable_computing_io/kepler" }}:{{ (index $kepler "image" | default dict).tag | default "v0.12.0" }}"
          imagePullPolicy: IfNotPresent
          ports:
            - { name: metrics, containerPort: {{ index $kepler "port" | default 28282 }}, hostPort: {{ index $kepler "port" | default 28282 }} }
          securityContext:
            # Required by Kepler for RAPL/HWMON energy counters; there is no unprivileged mode.
            privileged: true
          volumeMounts:
            - { name: proc, mountPath: /host/proc, readOnly: true }
            - { name: sys, mountPath: /host/sys, readOnly: true }
          env:
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
          resources:
            {{- toYaml (index $kepler "resources" | default dict) | nindent 12 }}
      volumes:
        - { name: proc, hostPath: { path: /proc, type: Directory } }
        - { name: sys, hostPath: { path: /sys, type: Directory } }
      tolerations:
        {{- toYaml (index $kepler "tolerations" | default (list (dict "operator" "Exists"))) | nindent 8 }}
{{- end }}
