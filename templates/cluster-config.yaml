{{- if .Values.clusterCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: owlpane-cluster-collector
  namespace: {{ .Release.Namespace }}
  labels: {{- include "owlpane.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 30s
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
        allocatable_types_to_report: [cpu, memory]
        # Why containers restart or wait: OOMKilled, Error, CrashLoopBackOff, ImagePullBackOff and so on.
        metrics:
          k8s.container.status.state: { enabled: true }
          k8s.container.status.reason: { enabled: true }
          # Autoscaling page and the platform HPA table. Names match collector 0.161 k8sclusterreceiver.
          k8s.hpa.current_replicas: { enabled: true }
          k8s.hpa.desired_replicas: { enabled: true }
          k8s.hpa.min_replicas: { enabled: true }
          k8s.hpa.max_replicas: { enabled: true }
          # Optional in 0.161. The console reads these names, not the older *.capacity / *.phase gauges.
          k8s.persistentvolumeclaim.storage.capacity: { enabled: true }
          k8s.persistentvolumeclaim.status.phase: { enabled: true }
      {{- if .Values.clusterCollector.events }}
      k8s_objects:
        auth_type: serviceAccount
        objects:
          # Never replay history for events on a restart — only nodes/workloads/etc. below need the
          # one-time inventory snapshot.
          - { name: events, mode: watch, group: events.k8s.io }
          {{- if .Values.clusterCollector.objectSnapshots }}
          # Full Node objects: role, taints, labels, addresses, kubelet/runtime/OS versions, cached
          # images, capacity/allocatable. The k8s_cluster receiver's node metrics don't carry this;
          # the console's node detail page reads it from this watch (kubernetes.service.ts nodeDetail).
          #
          # mode: pull, not watch: this collector's k8sobjectsreceiver (0.161.0) predates
          # include_initial_state, so plain "watch" only emits an object on its NEXT change — a Service,
          # PVC or Node that never changes again after the collector starts would never appear at all.
          # A 5-minute full re-list keeps these current without depending on the object ever changing.
          - { name: nodes, mode: pull, group: "", interval: 5m }
          - { name: services, mode: pull, group: "", interval: 5m }
          - { name: ingresses, mode: pull, group: networking.k8s.io, interval: 5m }
          - { name: deployments, mode: pull, group: apps, interval: 5m }
          - { name: statefulsets, mode: pull, group: apps, interval: 5m }
          - { name: daemonsets, mode: pull, group: apps, interval: 5m }
          - { name: jobs, mode: pull, group: batch, interval: 5m }
          - { name: cronjobs, mode: pull, group: batch, interval: 5m }
          - { name: persistentvolumeclaims, mode: pull, group: "", interval: 5m }
          - { name: persistentvolumes, mode: pull, group: "", interval: 5m }
          - { name: configmaps, mode: pull, group: "", interval: 5m }
          - { name: storageclasses, mode: pull, group: storage.k8s.io, interval: 5m }
          - { name: poddisruptionbudgets, mode: pull, group: policy, interval: 5m }
          {{- if .Values.clusterCollector.watchPods }}
          # Pods churn constantly (restarts, reschedules) so watch's "next change only" gap self-heals
          # in seconds; kept on watch rather than pull to avoid a full-cluster pod LIST every interval.
          - { name: pods, mode: watch, group: "" }
          {{- end }}
          {{- if .Values.clusterCollector.watchCertManager }}
          - { name: certificates, mode: pull, group: cert-manager.io, interval: 5m }
          {{- end }}
          {{- if .Values.clusterCollector.watchGatewayApi }}
          - { name: gateways, mode: pull, group: gateway.networking.k8s.io, interval: 5m }
          - { name: httproutes, mode: pull, group: gateway.networking.k8s.io, interval: 5m }
          {{- end }}
          {{- if .Values.clusterCollector.watchSecurityPosture }}
          - { name: namespaces, mode: pull, group: "", interval: 5m }
          - { name: limitranges, mode: pull, group: "", interval: 5m }
          - { name: resourcequotas, mode: pull, group: "", interval: 5m }
          - { name: networkpolicies, mode: pull, group: networking.k8s.io, interval: 5m }
          - { name: roles, mode: pull, group: rbac.authorization.k8s.io, interval: 5m }
          - { name: rolebindings, mode: pull, group: rbac.authorization.k8s.io, interval: 5m }
          - { name: clusterroles, mode: pull, group: rbac.authorization.k8s.io, interval: 5m }
          - { name: clusterrolebindings, mode: pull, group: rbac.authorization.k8s.io, interval: 5m }
          {{- end }}
          {{- if and .Values.clusterCollector.watchSecurityPosture .Values.securityIntegrations.policyReports.enabled }}
          - { name: policyreports, mode: pull, group: wgpolicyk8s.io, interval: 5m }
          - { name: clusterpolicyreports, mode: pull, group: wgpolicyk8s.io, interval: 5m }
          {{- end }}
          {{- end }}
      {{- end }}
    processors:
      memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
      resource:
        attributes:
          - { key: k8s.cluster.name, value: {{ .Values.cluster.name | quote }}, action: upsert }
          - { key: deployment.environment.name, value: {{ .Values.environment | quote }}, action: insert }
          - { key: service.name, value: "kubernetes-cluster", action: insert }
      batch: { send_batch_size: 1000, timeout: 10s }
    exporters:
      {{- include "owlpane.exporter" . | nindent 6 }}
    extensions:
      health_check: { endpoint: "0.0.0.0:13133" }
    service:
      extensions: [health_check]
      telemetry: { metrics: { level: none } }
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp_http]
        {{- if .Values.clusterCollector.events }}
        logs:
          receivers: [k8s_objects]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp_http]
        {{- end }}
{{- end }}
