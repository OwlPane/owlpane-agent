{{- if .Values.integrations.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owlpane-integrations
  namespace: {{ .Release.Namespace }}
  labels: {{- include "owlpane.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "owlpane.appName" . }}, app.kubernetes.io/component: integrations }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "owlpane.appName" . }}
        app.kubernetes.io/component: integrations
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/integrations-config.yaml") . | sha256sum | trunc 16 }}
    spec:
      {{- if include "owlpane.integrationsK8sScrape" . }}
      serviceAccountName: {{ include "owlpane.integrationsSa" . }}
      automountServiceAccountToken: true
      {{- else }}
      # No Kubernetes API access is needed to read a database, so this pod uses the namespace's default account.
      automountServiceAccountToken: false
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/conf/config.yaml"]
          env:
            - name: OWLPANE_INGEST_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.ingestKeySecret.name }}, key: {{ .Values.ingestKeySecret.key }} } }
            {{- range $i, $p := .Values.integrations.postgres }}
            - name: PG_USER_{{ $i }}
              valueFrom: { secretKeyRef: { name: {{ $p.secret.name }}, key: {{ $p.secret.userKey | default "username" }} } }
            - name: PG_PASSWORD_{{ $i }}
              valueFrom: { secretKeyRef: { name: {{ $p.secret.name }}, key: {{ $p.secret.passwordKey | default "password" }} } }
            {{- end }}
            {{- range $i, $r := .Values.integrations.redis }}
            {{- if $r.secret }}
            - name: REDIS_PASSWORD_{{ $i }}
              valueFrom: { secretKeyRef: { name: {{ $r.secret.name }}, key: {{ $r.secret.passwordKey | default "password" }} } }
            {{- end }}
            {{- end }}
            {{- range $i, $m := .Values.integrations.mysql }}
            - name: MYSQL_USER_{{ $i }}
              valueFrom: { secretKeyRef: { name: {{ $m.secret.name }}, key: {{ $m.secret.userKey | default "username" }} } }
            - name: MYSQL_PASSWORD_{{ $i }}
              valueFrom: { secretKeyRef: { name: {{ $m.secret.name }}, key: {{ $m.secret.passwordKey | default "password" }} } }
            {{- end }}
            {{- range $i, $m := .Values.integrations.mongodb }}
            - name: MONGO_USER_{{ $i }}
              valueFrom: { secretKeyRef: { name: {{ $m.secret.name }}, key: {{ $m.secret.userKey | default "username" }} } }
            - name: MONGO_PASSWORD_{{ $i }}
              valueFrom: { secretKeyRef: { name: {{ $m.secret.name }}, key: {{ $m.secret.passwordKey | default "password" }} } }
            {{- end }}
            {{- range $i, $q := .Values.integrations.rabbitmq }}
            - name: RABBIT_USER_{{ $i }}
              valueFrom: { secretKeyRef: { name: {{ $q.secret.name }}, key: {{ $q.secret.userKey | default "username" }} } }
            - name: RABBIT_PASSWORD_{{ $i }}
              valueFrom: { secretKeyRef: { name: {{ $q.secret.name }}, key: {{ $q.secret.passwordKey | default "password" }} } }
            {{- end }}
          readinessProbe: { httpGet: { path: /, port: 13133 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: 13133 }, periodSeconds: 20, initialDelaySeconds: 15 }
          resources: {{- toYaml .Values.integrations.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: conf, mountPath: /conf, readOnly: true }
      volumes:
        - name: conf
          configMap: { name: owlpane-integrations }
{{- end }}
