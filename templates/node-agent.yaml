{{- $na := include "owlpane.nodeAgentMerged" . | fromYaml -}}
{{- if $na.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: owlpane-node-agent
  namespace: {{ .Release.Namespace }}
  labels: {{- include "owlpane.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "owlpane.appName" . }}, app.kubernetes.io/component: node }
  updateStrategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 1 } }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "owlpane.appName" . }}
        app.kubernetes.io/component: node
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/node-config.yaml") . | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ include "owlpane.sa" . }}
      automountServiceAccountToken: true
      priorityClassName: system-node-critical
      tolerations: {{- toYaml (index $na "tolerations" | default (list (dict "operator" "Exists"))) | nindent 8 }}
      securityContext:
        {{- if .Values.logs.enabled }}
        runAsUser: 0
        {{- else }}
        runAsNonRoot: true
        runAsUser: 10001
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/conf/config.yaml"]
          env: {{- include "owlpane.env" . | nindent 12 }}
            {{- $rd := index $na "resourcedetection" | default dict -}}
            {{- if index $rd "enabled" | default true }}
            {{- $otelRa := include "owlpane.nodeOtelResourceAttributes" . | trim -}}
            {{- if $otelRa }}
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: {{ $otelRa | quote }} }
            {{- end }}
            {{- end }}
            {{- with index $na "extraEnv" }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - { name: otlp-http, containerPort: 4318{{ if index $na "otlpHostPort" }}, hostPort: 4318{{ end }} }
            - { name: otlp-grpc, containerPort: 4317{{ if index $na "otlpHostPort" }}, hostPort: 4317{{ end }} }
          readinessProbe: { httpGet: { path: /, port: 13133 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: 13133 }, periodSeconds: 20, initialDelaySeconds: 15 }
          resources: {{- toYaml (index $na "resources" | default dict) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: conf, mountPath: /conf, readOnly: true }
            {{- $hm := index $na "hostmetrics" | default dict -}}
            {{- if index $hm "enabled" | default true }}
            # Host root, read-only: the hostmetrics receiver reads /hostfs/proc and /hostfs/sys.
            - { name: hostfs, mountPath: /hostfs, readOnly: true, mountPropagation: HostToContainer }
            {{- end }}
            {{- if .Values.logs.enabled }}
            - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
            - { name: varlibdocker, mountPath: /var/lib/docker/containers, readOnly: true }
            {{- end }}
      volumes:
        - name: conf
          configMap: { name: owlpane-node-agent }
        {{- $hm := index $na "hostmetrics" | default dict -}}
        {{- if index $hm "enabled" | default true }}
        - { name: hostfs, hostPath: { path: /, type: Directory } }
        {{- end }}
        {{- if .Values.logs.enabled }}
        - { name: varlogpods, hostPath: { path: /var/log/pods } }
        - { name: varlibdocker, hostPath: { path: /var/lib/docker/containers } }
        {{- end }}
{{- end }}
