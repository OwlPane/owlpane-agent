# Where to send data and how to authenticate. The key is read from a Secret you create; the chart
# never contains a credential. Create it with:
#   kubectl -n owlpane create secret generic owlpane-ingest --from-literal=key=owl_ing_...
# Install published chart (console Setup uses the same OCI ref):
#   helm install owlpane oci://ghcr.io/balaji-singh/owlpane-agent --version 0.3.1 -n owlpane ...
endpoint: ""                  # required, e.g. https://ingest.example.com
apiEndpoint: ""               # Owlpane API, e.g. https://owlpane-api.example.com — enables heartbeat and, with ops.enabled, operations
ingestKeySecret:
  name: owlpane-ingest
  key: key

cluster:
  name: ""                    # required: shown as k8s.cluster.name
environment: production

# Install profile (documentation + recommended --set bundles). Not applied automatically — pick flags when installing.
# minimal:    node metrics + OTLP relay only (set clusterCollector.enabled=false, objectSnapshots=false)
# demo:       use values-demo-workloads.yaml with owlpane-demo-workloads for ingress paths + synthetic flows
# standard:   default below — metrics, events, routing snapshots, security posture watches
# security-full: standard + securityIntegrations.enabled=true (optional Trivy / policy report relay; needs CRDs)
profile: standard

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.161.0"
  pullPolicy: IfNotPresent

# Node agent (DaemonSet): node, pod and container metrics from the kubelet, plus an OTLP receiver
# that applications on the node can send to.
# kubeletstats uses metric_groups [node, pod, container, volume] — volume emits k8s.volume.capacity
# (Storage). node emits k8s.node.filesystem.usage. Network IO gauges stay on the node and pod groups.
# power byte totals on Kubernetes → Map topology edges when present.
nodeAgent:
  enabled: true
  kubeletInsecureSkipVerify: false   # set true only for clusters with self-signed kubelet certificates
  collectionInterval: 30s
  otlpHostPort: false                # expose 4317/4318 on the node for local pods (host network ports)
  # Host-level metrics (CPU, memory, disk, load, network, filesystem) from the node OS itself, next to
  # kubeletstats. Feeds Infrastructure → Hosts and the carbon validation cross-check; Kubernetes carbon
  # attribution stays on kubeletstats. Mounts the host root read-only at /hostfs (see README "Security").
  hostmetrics:
    enabled: true
  # Detects cloud.provider, cloud.region and host.type (env, then GCP, EC2, Azure) so carbon can pick a
  # power profile and grid zone. The env detector reads OTEL_RESOURCE_ATTRIBUTES first, so on-prem
  # clusters can set cloud.region / host.type there as a manual override.
  resourcedetection:
    enabled: true
  # Extra environment variables for the node agent. On clusters with no cloud metadata API, set the
  # carbon region and instance type here (replaces the chart's own OTEL_RESOURCE_ATTRIBUTES):
  # extraEnv:
  #   - { name: OTEL_RESOURCE_ATTRIBUTES, value: "host.name=$(K8S_NODE_NAME),cloud.provider=onprem,cloud.region=eu-central,host.type=server" }
  extraEnv: []
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  tolerations:
    - operator: Exists

# Owlpane Carbon: measured node power via Kepler (https://sustainable-computing.io). Off by default:
# Kepler runs privileged with host /proc and /sys to reach RAPL/HWMON energy counters. When enabled,
# the chart deploys Kepler v0.12.0 (the 0.10+ rewrite; metric kepler_node_cpu_watts on port 28282) as a
# host-network DaemonSet and the node agent scrapes its own node's Kepler over the node IP. Node energy
# then reports mode "measured" instead of the power-model estimate. See README "Security".
# VM / Docker host without Kubernetes: single-replica collector + hostmetrics (Phase 7). See values-standalone.yaml.
standaloneCollector:
  enabled: false
  hostmetrics:
    enabled: true
  resourcedetection:
    enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

carbon:
  kepler:
    enabled: false
    image:
      repository: quay.io/sustainable_computing_io/kepler
      tag: "v0.12.0"   # pinned: metric names and labels are documented against this version
    port: 28282
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 400Mi }
    tolerations:
      - operator: Exists

# Cluster collector (one replica): cluster state (workloads, restarts, conditions) and Kubernetes events.
clusterCollector:
  enabled: true
  events: true
  # Watch Kubernetes objects for routing, labels, TLS and Gateway API in the console. The receiver sends whole objects;
  # ConfigMap values, the last-applied-configuration annotation and pod env var values are removed on the node before
  # export (templates/cluster-config.yaml). ConfigMap keys, env var names and valueFrom references are kept.
  objectSnapshots: true
  watchPods: true
  # Requires cert-manager.io CRDs; if false, collector starts on vanilla clusters (Docker Desktop, kind).
  watchCertManager: false
  # Requires gateway.networking.k8s.io CRDs.
  watchGatewayApi: false
  # RBAC bindings, NetworkPolicies, Namespace PSS labels, and pod securityContext (with watchPods).
  watchSecurityPosture: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

# Allowlisted writes (scale, restart, evict, PVC expand, NetworkPolicy). Off by default.
# Requires apiEndpoint. The runner polls the API (egress only) and applies one operation at a time.
ops:
  enabled: false
  pollSeconds: 10
  # Empty = cluster-wide ClusterRole. Set namespaces to render a Role per namespace instead.
  scopeNamespaces: []
  image:
    repository: alpine/k8s
    tag: "1.31.4"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# Container logs from every pod on the node. Off by default: it needs read access to the node's log
# directory and the container runtime's files, and logs often hold personal data. Enable knowingly.
logs:
  enabled: false
  excludeNamespaces: [kube-system, owlpane]

# Beyond attributes/scrub: SQL literals, emails, bearer tokens, card-like numbers and
# password/token/secret values removed from trace and log free text before it leaves this node.
# On by default (secure by default); a redaction counter metric proves the control ran. See
# docs/03-security-and-privacy.md.
redaction:
  enabled: true

# Kubernetes metadata attached to telemetry. Labels and annotations are off by default because they
# sometimes carry secrets or personal data; list the ones you want.
metadata:
  labels: []       # e.g. [{tagName: team, key: team, from: pod}]
  annotations: []

networkPolicy:
  enabled: false

rbac:
  create: true
serviceAccount:
  create: true
  name: ""

# Database integrations: a small extra collector that connects to your databases and reports their health
# (connections, cache hit ratio, replication lag, memory, evictions). It needs network access to them and a
# read-only account. Passwords come from Secrets you create; the chart never contains a credential.
#   postgres: create a role with `GRANT pg_monitor TO owlpane;`
#   redis: an ACL user limited to `+info +ping` is enough.
# Optional CVE and policy findings relay (subchart). Off by default; enable only with profile security-full.
securityIntegrations:
  enabled: false
  trivyOperator:
    enabled: false
  policyReports:
    enabled: false

# Phase C network collector. Off by default — see docs/adr/0008-network-ebpf-collector.md
# conntrack: reads host /proc connection tables and posts owlpane.flow.* (no packet payloads).
# beyla: optional Grafana Beyla DaemonSet for eBPF network metrics (no TLS body decrypt).
networkCollector:
  enabled: false
  image:
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent
  intervalSeconds: 30
  captureFilters:
    namespaces: []   # Beyla / eBPF: limit K8s metadata to these namespaces (empty = all)
    ports: []        # conntrack: only emit flows with remote port in this list (empty = all)
    targetPods: []   # eBPF: optional pod name prefixes (empty = all pods on node)
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
  otlp:
    serviceName: owlpane-network
  beyla:
    enabled: false
    # Beyla loads eBPF maps that count against the container's memory: the conntrack sidecar's 128Mi limit gets it OOM-killed.
    resources:
      requests: { cpu: 100m, memory: 200Mi }
      limits: { memory: 768Mi }
    # Application spans: Beyla watches processes listening on these ports and emits HTTP/gRPC server spans (method,
    # route, status, latency) with Kubernetes metadata. Needs hostPID. These become the real calls in Network > API.
    applicationSpans:
      enabled: false
      openPorts: "80,443,8000-8999"   # BEYLA_OPEN_PORT syntax: ports and ranges to instrument
    image:
      repository: grafana/beyla
      tag: "2.2.4"
      pullPolicy: IfNotPresent
  # P2 parity: privileged CO-RE eBPF capture (ADR 0009).
  # No capture image is published yet, so enabling this fails at render time (see imagePublished). For real L7
  # data today, use the beyla option above plus OpenTelemetry SDKs, or the Kubeshark forwarder.
  ebpfCapture:
    enabled: false
    imagePublished: true    # ghcr.io/balaji-singh/network-ebpf:0.1.0 (bootstrap; not full CO-RE BPF)
    privileged: true
    hostNetwork: true
    delayedDissection: false
    image:
      repository: ghcr.io/balaji-singh/network-ebpf
      tag: "0.1.0"
      pullPolicy: IfNotPresent
  tlsDecrypt:
    enabled: false  # P3 — requires ADR-0009 security acceptance; never enable by default

# Network device monitoring (NDM): polls routers/switches/firewalls over SNMP v2c/v3 plus ICMP ping
# and reports interface throughput/errors/status, CPU, memory, and availability as snmp.* / owlpane.ping.*
# metrics and owlpane.ndm.* inventory logs. Off by default. Credentials come from Secrets you create;
# the chart never contains a community string or SNMPv3 key.
#   kubectl -n owlpane create secret generic ndm-core-switch --from-literal=community='…'
ndm:
  enabled: false
  intervalSeconds: 60
  maxInterfacesPerDevice: 64
  image:
    repository: ghcr.io/balaji-singh/owlpane-ndm
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }
  devices: []
  #  - name: core-switch
  #    host: 10.0.0.2
  #    version: v2c                                   # v2c | v3
  #    communitySecret: { name: ndm-core-switch, key: community }
  #    configBackup:                                  # optional — needs ndm.configBackup.enabled
  #      sshSecret: { name: ndm-core-switch-ssh, userKey: username, passwordKey: password }
  #      command: show running-config                 # optional override (e.g. "show configuration" on Junos)
  #  - name: edge-router
  #    host: 10.0.0.1
  #    version: v3
  #    v3:
  #      userSecret: { name: ndm-edge-router, key: user }
  #      authProtocol: SHA                            # optional, default SHA
  #      authKeySecret: { name: ndm-edge-router, key: authkey }     # optional → authNoPriv when omitted
  #      privProtocol: AES                            # optional, default AES
  #      privKeySecret: { name: ndm-edge-router, key: privkey }     # optional → needs authKeySecret
  # Opt-in subnet discovery (LogicMonitor/Auvik-style auto-discovery). Ping-sweeps one CIDR
  # from inside the cluster, probes SNMP sysName on responders, and reports
  # owlpane.ndm.discovered logs plus one owlpane.ndm.discovery.run audit record per run.
  # Prefix must be /22 or smaller (≤1024 hosts); runs in its own container, rate-limited.
  discovery:
    enabled: false
    intervalSeconds: 3600
    cidr: ""                                     # e.g. 10.0.0.0/24
    ratePerSecond: 20
    communitySecret: { name: "", key: "" }       # v2c community used only for probing
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }
  # NetFlow v5/v9 + IPFIX receiver (Datadog NDM-style top talkers). Point your devices'
  # flow export at this Service (ClusterIP works when exporters can route to the pod
  # network; otherwise NodePort/LoadBalancer). Aggregates conversations in memory and
  # posts owlpane.ndm.flow.* logs every intervalSeconds. No packet payloads are stored.
  flow:
    enabled: false
    port: 2055
    intervalSeconds: 60
    serviceType: ClusterIP                       # ClusterIP | NodePort | LoadBalancer
    nodePort: 0                                  # optional pin when serviceType=NodePort
    image:
      repository: ghcr.io/balaji-singh/owlpane-ndm-flow
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
  # Auvik-style config backup: SSH "show running-config" per device on an interval,
  # redacted (passwords/communities/keys stripped) and stored as a versioned log when
  # the hash changes. Per device add `configBackup.sshSecret` pointing at a Secret with
  # username + password keys; the device entry also needs `configBackup.command` when
  # the default (show running-config) doesn't apply.
  configBackup:
    enabled: false
    intervalSeconds: 3600
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }

integrations:
  enabled: false
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
  collectionInterval: 60s
  postgres: []
  mysql: []
  mongodb: []
  kafka: []
  rabbitmq: []
  nginx: []
  # Cloud: scrape a Prometheus-format exporter (YACE, stackdriver_exporter, azure_metrics_exporter, …)
  cloudScrapes: []
  #  - name: orders-db                 # shown as the service name
  #    endpoint: orders-db.default.svc:5432
  #    databases: []                   # empty = all
  #    tls: { insecure: false }        # set insecure: true only for in-cluster databases without TLS
  #    secret: { name: orders-db-monitor, userKey: username, passwordKey: password }
  redis: []
  #  - name: session-cache
  #    endpoint: session-cache.default.svc:6379
  #    secret: { name: session-cache-monitor, passwordKey: password }   # omit for no password
