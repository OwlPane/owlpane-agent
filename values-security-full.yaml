# Example values for profile: security-full
#   helm upgrade --install owlpane-agent oci://ghcr.io/owlpane/owlpane-agent -f values-security-full.yaml \
#     --set endpoint=https://ingest.example.com --set cluster.name=my-cluster

profile: security-full

clusterCollector:
  objectSnapshots: true
  watchPods: true
  watchSecurityPosture: true
  watchCertManager: false
  watchGatewayApi: false

securityIntegrations:
  enabled: true
  policyReports:
    enabled: true
  trivyOperator:
    enabled: false
